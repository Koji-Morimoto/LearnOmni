<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <defs>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#89b4fa"/>
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#cdd6f4"/>
    </marker>
  </defs>

  <rect class="background" x="0" y="0" width="1000" height="640" fill="#1e1e2e"/>

  <text x="500" y="34" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#cdd6f4">Isaac Sim 6.0 の1フレームで進む周期の重ね合わせ</text>
  <text x="500" y="56" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#a6adc8">左から右が1回の App.update() 内の実行順序</text>

  <rect x="345" y="76" width="310" height="34" rx="6" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="500" y="98" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#cdd6f4">asyncio イベントループが1巡</text>

  <line x1="500" y1="110" x2="500" y2="132" stroke="#cdd6f4" stroke-width="2" marker-end="url(#arrowGray)"/>

  <rect class="container" x="60" y="134" width="880" height="252" rx="8" fill="none" stroke="#585b70" stroke-width="2"/>
  <text x="80" y="163" text-anchor="start" font-family="Noto Sans CJK JP, sans-serif" font-size="16" fill="#cdd6f4">App.update() 1回分 = ランループの1周期 (loop_dt)</text>

  <rect x="85" y="186" width="150" height="112" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="160" y="212" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#89b4fa">(1) タイムライン</text>
  <text x="160" y="234" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#cdd6f4">omni.timeline が</text>
  <text x="160" y="254" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#cdd6f4">loop_dt だけ進む</text>
  <text x="160" y="280" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#a6adc8">1周期 = 1/timeCodes</text>

  <line x1="237" y1="242" x2="253" y2="242" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="255" y="186" width="150" height="112" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="330" y="212" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#89b4fa">(2) 物理サブステップ</text>
  <text x="330" y="234" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#cdd6f4">physics_dt を N 回</text>
  <text x="330" y="254" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#cdd6f4">(N は 0 以上)</text>
  <text x="330" y="280" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#a6adc8">order -10</text>

  <line x1="407" y1="242" x2="423" y2="242" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="425" y="186" width="150" height="112" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="500" y="212" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#89b4fa">(3) 描画用時刻の公開</text>
  <text x="500" y="234" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#cdd6f4">物理時刻を Fabric の</text>
  <text x="500" y="254" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#cdd6f4">prim へ書き込む</text>
  <text x="500" y="280" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#a6adc8">外部時刻の prim</text>

  <line x1="577" y1="242" x2="593" y2="242" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="595" y="186" width="150" height="112" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="670" y="212" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#a6e3a1">(4) センサtick判定</text>
  <text x="670" y="234" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#cdd6f4">tickRate を満たした</text>
  <text x="670" y="254" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#cdd6f4">センサだけ描画する</text>
  <text x="670" y="280" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#a6adc8">order 30</text>

  <line x1="747" y1="242" x2="763" y2="242" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <rect x="765" y="186" width="150" height="112" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="840" y="212" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#a6e3a1">(5) ビューポート</text>
  <text x="840" y="234" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#cdd6f4">画面用の1枚が</text>
  <text x="840" y="254" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#cdd6f4">描き終わる</text>
  <text x="840" y="280" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#a6adc8">ここを待つのが正解</text>

  <text x="80" y="330" text-anchor="start" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#f9e2af">Play OFF のときは (2) の N が常に 0 になり、物理時刻も (3) の値も止まったままになる</text>
  <text x="80" y="356" text-anchor="start" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#f9e2af">それでも (1)(4)(5) は動き続けるため、USD を書き換えれば絵は更新される</text>

  <text x="60" y="424" text-anchor="start" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#cdd6f4">frames-in-flight : 描画は複数フレームが同時に進行する (既定 3 枚)</text>

  <rect x="200" y="440" width="180" height="46" rx="6" fill="#313244" stroke="#cdd6f4" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="290" y="469" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#cdd6f4">フレーム N</text>

  <rect x="400" y="440" width="180" height="46" rx="6" fill="#313244" stroke="#cdd6f4" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="490" y="469" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#cdd6f4">フレーム N+1</text>

  <rect x="600" y="440" width="180" height="46" rx="6" fill="#313244" stroke="#cdd6f4" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="690" y="469" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#cdd6f4">フレーム N+2</text>

  <rect class="container" x="60" y="512" width="880" height="72" rx="6" fill="none" stroke="#585b70" stroke-width="1"/>
  <text x="80" y="536" text-anchor="start" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#cdd6f4">凡例</text>

  <rect x="150" y="524" width="22" height="16" rx="3" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="180" y="537" text-anchor="start" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#cdd6f4">青枠 : 時刻を進める段階</text>

  <rect x="400" y="524" width="22" height="16" rx="3" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="430" y="537" text-anchor="start" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#cdd6f4">緑枠 : 描画が起きる段階</text>

  <rect x="650" y="524" width="22" height="16" rx="3" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="680" y="537" text-anchor="start" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#cdd6f4">黄枠 : Python が乗る場所</text>

  <rect x="150" y="556" width="22" height="16" rx="3" fill="#313244" stroke="#cdd6f4" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="180" y="569" text-anchor="start" font-family="Noto Sans CJK JP, sans-serif" font-size="13" fill="#cdd6f4">灰の破線枠 : 複数フレームにまたがる仕組み</text>

  <text x="500" y="614" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#f9e2af">結論 : アプリのフレームを N 回待っても、描画完了を待ったことにはならない</text>
</svg>
